<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for the Biggest Fan daemon (installed to
  /etc/dbus-1/system.d/ by the .deb). It lets the root-run daemon own
  `net.ynottony.ten.biggestfan` and lets local users control their fans
  through it, so `biggest-fan gui` needs no root while the service runs.

  On machines with untrusted local users, restrict the second policy
  block (for example to a `<policy group="users">`) so only members of
  that group may change fan behaviour.
-->
<busconfig>
  <policy user="root">
    <allow own="net.ynottony.ten.biggestfan"/>
    <allow send_destination="net.ynottony.ten.biggestfan"/>
    <allow receive_sender="net.ynottony.ten.biggestfan"/>
  </policy>

  <policy context="default">
    <allow send_destination="net.ynottony.ten.biggestfan"/>
    <allow receive_sender="net.ynottony.ten.biggestfan"/>
  </policy>
</busconfig>
