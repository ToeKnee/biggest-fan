<?xml version="1.0" encoding="UTF-8"?>
<!-- Biggest Fan app icon: a case-view fan — ring, seven swept impeller
     blades and hub — on the dark app background. Rendered to fixed-size
     PNGs by tools/render-icons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#212125"/>
  <!-- Soft housing disc, like the idle fan circle in the case view. -->
  <circle cx="256" cy="256" r="184" fill="#3380e6" fill-opacity="0.16"/>
  <!-- Seven swept blades, one per 1/7 turn. Each blade spans 180/7 deg of
       arc and the gap to the next blade is the same size, at every radius:
       the straight flanks are chords that keep blade and gap equal
       (25.7 deg) from hub to ring, sweeping 38 deg outward. -->
  <g fill="#3380e6" opacity="0.9">
    <path d="M290 256 L405.7 139 A190 190 0 0 0 340.2 85.7 L286.6 241.2
             A34 34 0 0 1 290 256 Z"/>
    <path d="M290 256 L405.7 139 A190 190 0 0 0 340.2 85.7 L286.6 241.2
             A34 34 0 0 1 290 256 Z" transform="rotate(51.43 256 256)"/>
    <path d="M290 256 L405.7 139 A190 190 0 0 0 340.2 85.7 L286.6 241.2
             A34 34 0 0 1 290 256 Z" transform="rotate(102.86 256 256)"/>
    <path d="M290 256 L405.7 139 A190 190 0 0 0 340.2 85.7 L286.6 241.2
             A34 34 0 0 1 290 256 Z" transform="rotate(154.29 256 256)"/>
    <path d="M290 256 L405.7 139 A190 190 0 0 0 340.2 85.7 L286.6 241.2
             A34 34 0 0 1 290 256 Z" transform="rotate(205.71 256 256)"/>
    <path d="M290 256 L405.7 139 A190 190 0 0 0 340.2 85.7 L286.6 241.2
             A34 34 0 0 1 290 256 Z" transform="rotate(257.14 256 256)"/>
    <path d="M290 256 L405.7 139 A190 190 0 0 0 340.2 85.7 L286.6 241.2
             A34 34 0 0 1 290 256 Z" transform="rotate(308.57 256 256)"/>
  </g>
  <!-- Hub, drawn over the blade roots. -->
  <circle cx="256" cy="256" r="30" fill="#212125"/>
  <circle cx="256" cy="256" r="30" fill="none" stroke="#3380e6" stroke-width="10"/>
  <!-- Guard ring, drawn last to sit over the blade tips. -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#3380e6" stroke-width="24"/>
</svg>
